name: Validate NOCTURNE STUDIO CAD sources

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract and validate application modules
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ModuleExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script" and dict(attrs).get("type") == "module":
                      self.capture = True
                      self.current = []

              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      self.scripts.append("".join(self.current))
                      self.capture = False

          for source in ("index.html", "studio-3d.html"):
              parser = ModuleExtractor()
              parser.feed(Path(source).read_text(encoding="utf-8"))
              if len(parser.scripts) != 1:
                  raise SystemExit(
                      f"{source}: expected one module script, found {len(parser.scripts)}"
                  )
              Path(f"/tmp/{Path(source).stem}.js").write_text(
                  parser.scripts[0], encoding="utf-8"
              )
          PY
          node --check /tmp/index.js
          node --check /tmp/studio-3d.js
          node --test tests/cad-geometry.test.mjs
