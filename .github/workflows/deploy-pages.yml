name: Deploy NOCTURNE STUDIO 3D to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app source
        run: |
          cmp -s index.html studio-3d.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ModuleExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and dict(attrs).get('type') == 'module':
                      self.capture = True
                      self.current = []

              def handle_data(self, data):
                  if self.capture:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self.capture:
                      self.scripts.append(''.join(self.current))
                      self.capture = False

          parser = ModuleExtractor()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if len(parser.scripts) != 1:
              raise SystemExit(f'Expected one module script, found {len(parser.scripts)}')
          Path('/tmp/nocturne-app.js').write_text(parser.scripts[0], encoding='utf-8')
          PY
          node --check /tmp/nocturne-app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        run: sleep 15
      - name: Publish app
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

