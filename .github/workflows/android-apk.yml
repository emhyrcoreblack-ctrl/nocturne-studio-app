name: Build NOCTURNE Android APK

on:
  push:
    branches: [android-package-foundation]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nocturne-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: nocturne-studio-debug-signing-v1

      - name: Create signing key on first build
        run: |
          if [ ! -s android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s android/app/debug.keystore

      - name: Vendor pinned Three.js modules for offline runtime
        working-directory: android
        run: bash scripts/vendor-three.sh

      - name: Build installable APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOCTURNE-STUDIO-3D-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nocturne-android-build-${{ github.run_number }}
          target_commitish: android-package-foundation
          name: NOCTURNE Android build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
